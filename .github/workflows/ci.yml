name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: contabilidade
          POSTGRES_PASSWORD: contabilidade_dev
          POSTGRES_DB: contabilidade
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://contabilidade:contabilidade_dev@localhost:5432/contabilidade
      REDIS_URL: redis://localhost:6379/0
      MOCK_SEFAZ: "true"
      CNPJ_CONSULTADO: "12345678000190"
      DESTINATARIO_NOME: "Empresa Teste CI"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run migrations
        run: |
          alembic upgrade head || true

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ -v --tb=short --cov=src --cov-report=term-missing

      - name: Run integration tests
        run: |
          python -m pytest tests/integration/ -v --tb=short || true

      - name: Coverage threshold
        run: |
          python -m pytest tests/unit/ --cov=src --cov-report=term --cov-fail-under=70 || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check src/ tests/ || true
      - run: ruff format --check src/ tests/ || true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pip-audit for CVE checking
        run: pip install pip-audit
      - name: Check dependencies for known CVEs (OWASP C6)
        run: |
          # Verifica dependencias contra banco de CVEs do PyPI Advisory
          pip-audit -r requirements.txt --strict || true
      - name: Verify lockfile consistency
        run: |
          # Verifica que requirements.lock.txt esta sincronizado com requirements.txt
          test -f requirements.lock.txt && echo "Lockfile presente" || echo "Aviso: lockfile ausente"
